<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Crymble & Sons — Admin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="root"></div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js';
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut,
    setPersistence, browserLocalPersistence
  } from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js';
  import {
    getDatabase, ref, push, onValue, query, orderByChild,
    serverTimestamp, remove
  } from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-database.js';

  const firebaseConfig = {
    apiKey: "AIzaSyCvCyWtasqSF-jRBMpAHV93oJj9yYWwYSc",
    authDomain: "crymble-admin.firebaseapp.com",
    databaseURL: "https://crymble-admin-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "crymble-admin",
    storageBucket: "crymble-admin.firebasestorage.app",
    messagingSenderId: "717102737896",
    appId: "1:717102737896:web:2a0d1b3f3ea932ba41dc5d",
    measurementId: "G-T14X9ME2D8"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);
  await setPersistence(auth, browserLocalPersistence);

  window.fb = {
    onAuthChanged(cb) { return onAuthStateChanged(auth, cb); },
    signIn(email, password) { return signInWithEmailAndPassword(auth, email, password); },
    signOut() { return signOut(auth); },
    addNote(data) {
      return push(ref(db, 'notes'), { ...data, created: serverTimestamp() });
    },
    deleteNote(id) { return remove(ref(db, 'notes/' + id)); },
    subscribeNotes(cb) {
      const q = query(ref(db, 'notes'), orderByChild('created'));
      return onValue(q, (snap) => {
        const items = [];
        snap.forEach(child => items.push({ id: child.key, ...child.val() }));
        items.reverse();
        cb(items);
      }, () => cb([]));
    }
  };
  window.dispatchEvent(new Event('fb-ready'));
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="sections.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
